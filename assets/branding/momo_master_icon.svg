<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBgSunset" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="50%" stop-color="#FF8E53"/>
      <stop offset="100%" stop-color="#FFAE33"/>
    </linearGradient>

    <linearGradient id="cardIndigoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <linearGradient id="iconMomoBody" x1="160" y1="140" x2="360" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFF5F5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>

    <linearGradient id="iconEarInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <radialGradient id="iconMomoBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D6D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF4D6D" stop-opacity="0"/>
    </radialGradient>

    <filter id="iconMomoShadow" x="50" y="60" width="412" height="412" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#B91C1C" flood-opacity="0.25"/>
    </filter>

    <filter id="cardDropShadow" x="150" y="300" width="212" height="150" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#9A3412" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#iconBgSunset)"/>
  <rect width="508" height="508" x="2" y="2" rx="118" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>

  <circle cx="256" cy="275" r="175" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="256" cy="275" r="145" fill="#FFFFFF" fill-opacity="0.08"/>

  <ellipse cx="256" cy="430" rx="135" ry="24" fill="#C2410C" fill-opacity="0.25"/>

  <!-- Authentic Momo with Both Plush Ears & Dumpling Body (100% Uncovered) -->
  <g filter="url(#iconMomoShadow)">
    <g>
      <ellipse cx="170" cy="155" rx="36" ry="52" transform="rotate(-20 170 155)" fill="#FFFFFF"/>
      <ellipse cx="170" cy="155" rx="22" ry="36" transform="rotate(-20 170 155)" fill="url(#iconEarInner)"/>
      <ellipse cx="342" cy="155" rx="36" ry="52" transform="rotate(20 342 155)" fill="#FFFFFF"/>
      <ellipse cx="342" cy="155" rx="22" ry="36" transform="rotate(20 342 155)" fill="url(#iconEarInner)"/>
    </g>
    <path d="M 256 145 C 366 145, 400 210, 400 298 C 400 390, 350 412, 256 412 C 162 412, 112 390, 112 298 C 112 210, 146 145, 256 145 Z" fill="url(#iconMomoBody)" stroke="#FFE4E6" stroke-width="2"/>
  </g>

  <!-- Rosy Blush Cheeks -->
  <circle cx="170" cy="310" r="26" fill="url(#iconMomoBlush)"/>
  <circle cx="342" cy="310" r="26" fill="url(#iconMomoBlush)"/>

  <!-- Anime Sparkle Eyes -->
  <ellipse cx="204" cy="268" rx="19" ry="26" fill="#18181B"/>
  <ellipse cx="212" cy="256" rx="8" ry="11" fill="#FFFFFF"/>
  <circle cx="198" cy="280" r="4.5" fill="#FFFFFF"/>
  <circle cx="217" cy="278" r="2.5" fill="#FFFFFF" fill-opacity="0.8"/>

  <ellipse cx="308" cy="268" rx="19" ry="26" fill="#18181B"/>
  <ellipse cx="316" cy="256" rx="8" ry="11" fill="#FFFFFF"/>
  <circle cx="302" cy="280" r="4.5" fill="#FFFFFF"/>
  <circle cx="321" cy="278" r="2.5" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- Sweet Smile with Pink Tongue -->
  <path d="M 242 292 Q 256 308, 270 292" stroke="#18181B" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 249 299 Q 256 310, 263 299 Z" fill="#FB7185"/>

  <!-- CONCEPT 1: Held Bookmark Note Card (Brand Indigo) -->
  <g filter="url(#cardDropShadow)">
    <!-- Brand Indigo Rounded Note Card -->
    <rect x="176" y="326" width="160" height="92" rx="18" fill="url(#cardIndigoGrad)" stroke="#818CF8" stroke-width="2.5"/>
    
    <!-- Attached Coral/Pink Bookmark Ribbon Tab with Gold Star -->
    <path d="M 238 312 L 274 312 C 276 312, 277 313, 277 315 L 277 350 L 256 338 L 235 350 L 235 315 C 235 313, 236 312, 238 312 Z" fill="#FF6B8B"/>
    <circle cx="256" cy="324" r="3.5" fill="#FBBF24"/>

    <!-- Crisp Embossed Note Lines -->
    <line x1="198" y1="368" x2="314" y2="368" stroke="#E0E7FF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="198" y1="384" x2="284" y2="384" stroke="#E0E7FF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

    <!-- Momo's Little Plush Paws Holding the Card -->
    <ellipse cx="176" cy="372" rx="16" ry="12" fill="url(#iconMomoBody)" stroke="#FFE4E6" stroke-width="1.5"/>
    <ellipse cx="336" cy="372" rx="16" ry="12" fill="url(#iconMomoBody)" stroke="#FFE4E6" stroke-width="1.5"/>
  </g>

  <!-- Ambient Star Sparkle -->
  <path d="M 406 102 L 409 110 L 417 113 L 409 116 L 406 124 L 403 116 L 395 113 L 403 110 Z" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="372" cy="94" r="3" fill="#FFFFFF" fill-opacity="0.8"/>
</svg>
